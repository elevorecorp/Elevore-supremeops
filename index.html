function calcDNA(cJobs) {
    if(!cJobs.length) return 0;
    let s=0;
    s+=Math.min(40,cJobs.length*10);
    s+=Math.min(30,cJobs.filter(j=>j.status==='paid').length*10);
    s+=Math.min(20,cJobs.filter(j=>j.specs?.frequency!=='one-time').length*10);
    s+=cJobs.some(j=>j.specs?.referral)?10:0;
    return Math.min(100,s);
}

// ── SIGNATURE CANVAS COMPONENT ──
function SignaturePad({onSave, label="Sign to approve"}) {
    const ref = useRef(null);
    const [drawing, setDrawing] = useState(false);
    const [hasStrokes, setHasStrokes] = useState(false);

    const getXY = (e) => {
        const r = ref.current.getBoundingClientRect();
        const src = e.touches ? e.touches[0] : e;
        return [src.clientX - r.left, src.clientY - r.top];
    };

    const start = (e) => {
        e.preventDefault();
        const [x,y] = getXY(e);
        const ctx = ref.current.getContext('2d');
        ctx.beginPath(); ctx.moveTo(x,y);
        setDrawing(true);
    };

    const move = (e) => {
        if(!drawing) return;
        e.preventDefault();
        const [x,y] = getXY(e);
        const ctx = ref.current.getContext('2d');
        ctx.lineTo(x,y);
        ctx.strokeStyle='#22c55e'; ctx.lineWidth=3; ctx.lineCap='round';
        ctx.stroke();
        setHasStrokes(true);
    };

    const clear = () => {
        const ctx = ref.current.getContext('2d');
        ctx.clearRect(0,0,ref.current.width,ref.current.height);
        setHasStrokes(false);
    };

    const save = () => {
        if(!hasStrokes) return;
        onSave(ref.current.toDataURL());
    };

    return (
        <div className="space-y-3">
            <p className="text-[10px] font-black text-amber-500 uppercase text-center tracking-widest">{label}</p>
            <canvas ref={ref} width={320} height={140} className="signature-pad w-full"
                onMouseDown={start} onTouchStart={start}
                onMouseMove={move} onTouchMove={move}
                onMouseUp={()=>setDrawing(false)} onTouchEnd={()=>setDrawing(false)} />
            <div className="flex gap-2">
                <button onClick={clear} className="flex-1 py-3 bg-white/5 text-slate-400 rounded-2xl font-black uppercase text-[10px] border border-white/5">Clear</button>
                <button onClick={save} disabled={!hasStrokes} className={`flex-1 py-3 rounded-2xl font-black uppercase text-[10px] transition-all ${hasStrokes?'gold-button active:scale-95':'bg-white/5 text-slate-600'}`}>
                    {hasStrokes ? '✅ Confirm Signature' : 'Sign above first'}
                </button>
            </div>
        </div>
    );
}

                                    </div>
                                    <div className="space-y-3 border-t border-white/5 pt-4">
                                        <select value={state.team} className="input-ceo text-xs text-center" onChange={e=>setState({...state,team:e.target.value})}>
                                            <option value="">Select Team...</option>
                                            <option value="Team Alpha">Team Alpha</option>
                                            <option value="Team Beta">Team Beta</option>
                                            <option value="Jose Mario">Jose Mario (CEO)</option>
                                        </select>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1"><p className="text-[9px] text-slate-500 uppercase font-black">Deploy Date</p><input type="date" value={state.date} className="input-ceo text-[11px] font-black" onChange={e=>setState({...state,date:e.target.value})} /></div>
                                            <div className="space-y-1"><p className="text-[9px] text-slate-500 uppercase font-black">Deposit ($)</p><input type="number" placeholder="0" value={state.deposit} className="input-ceo text-blue-400 font-black text-center" onChange={e=>setState({...state,deposit:parseFloat(e.target.value)||0})} /></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white text-black p-10 rounded-[4rem] text-center shadow-2xl relative overflow-hidden active:scale-95 transition-all">
                            <div className="absolute top-0 left-0 w-full h-2 bg-green-500 animate-pulse"></div>
                            <div className="flex justify-between items-center mb-4">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Deployment Value</p>
                                <span className={`text-[9px] font-black px-3 py-1 rounded-lg border ${pricingEngine.adviceColor} border-current`}>{pricingEngine.advice}</span>
                            </div>
                            <h4 className="text-[7rem] font-black italic tracking-tighter leading-none mb-6 text-black">
                                <span className="text-4xl align-top mr-1 font-light opacity-30">$</span>{state.totalPrice}
                            </h4>
                            <button onClick={deploy} className="w-full bg-slate-900 text-white py-8 rounded-[3rem] font-black text-xl uppercase italic active:scale-90 transition-all shadow-xl shadow-green-500/20">
                                {editId?'Update Mission ⚡':'Execute Deploy 🚀'}
                            </button>
                        </div>
                    </div>
                )}
            </main>

            <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-sm titan-card p-3 flex justify-around items-center border border-white/10 shadow-[0_40px_80px_rgba(0,0,0,1)] z-[1000]">
                <button onClick={()=>setView('intel')}   className={`p-3 rounded-2xl flex-1 flex flex-col items-center gap-1 transition-all ${view==='intel'?'text-amber-500 bg-white/5':'text-slate-500'}`}><i data-lucide="brain"></i><span className="text-[7px] font-black uppercase">Intel</span></button>
                <button onClick={()=>setView('agenda')}  className={`p-3 rounded-2xl flex-1 flex flex-col items-center gap-1 transition-all ${view==='agenda'?'text-green-500 bg-white/5':'text-slate-500'}`}><i data-lucide="shield-check"></i><span className="text-[7px] font-black uppercase">Logs</span></button>
                <button onClick={()=>setView('clients')} className={`p-3 rounded-2xl flex-1 flex flex-col items-center gap-1 transition-all ${view==='clients'?'text-purple-400 bg-white/5':'text-slate-500'}`}><i data-lucide="users"></i><span className="text-[7px] font-black uppercase">DNA</span></button>
                <button onClick={()=>setView('drive')}   className={`p-3 rounded-2xl flex-1 flex flex-col items-center gap-1 transition-all ${view==='drive'?'text-blue-400 bg-white/5':'text-slate-500'}`}><i data-lucide="image"></i><span className="text-[7px] font-black uppercase">Drive</span></button>
                <button onClick={()=>{setEditId(null);setState(INITIAL_STATE);setView('deploy');setDeployTab('identity');}} className={`p-3 rounded-2xl flex-1 flex flex-col items-center gap-1 transition-all ${view==='deploy'?'text-blue-500 bg-white/5':'text-slate-500'}`}><i data-lucide="zap"></i><span className="text-[7px] font-black uppercase">New</span></button>
            </nav>
        </div>
    );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
setTimeout(()=>lucide.createIcons(),500);
</script>
</body>
</html>
