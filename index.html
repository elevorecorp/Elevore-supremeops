// ─── SIGNATURE PAD COMPONENT ────────────────────────────────
function SigPad({onSave, label="Sign to approve"}) {
    const ref = useRef(null);
    const [drawing, setDrawing] = useState(false);
    const [hasStrokes, setHasStrokes] = useState(false);
    const lastPos = useRef({x:0,y:0});

    // resize canvas to match display size
    useEffect(()=>{
        const canvas = ref.current;
        if(!canvas) return;
        const resize = () => {
            const w = canvas.offsetWidth;
            // preserve existing drawing if any
            const img = canvas.toDataURL();
            canvas.width  = w;
            canvas.height = 140;
            if(hasStrokes){
                const image = new Image();
                image.src = img;
                image.onload = () => canvas.getContext('2d').drawImage(image,0,0);
            }
        };
        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
    }, []);

    const getXY = (e) => {
        const r = ref.current.getBoundingClientRect();
        const src = e.touches ? e.touches[0] : e;
        return { x: src.clientX - r.left, y: src.clientY - r.top };
    };

    const start = (e) => {
        e.preventDefault();
        const {x,y} = getXY(e);
        lastPos.current = {x,y};
        const ctx = ref.current.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(x,y);
        setDrawing(true);
    };

    const move = (e) => {
        if(!drawing) return;
        e.preventDefault();
        const {x,y} = getXY(e);
        const ctx = ref.current.getContext('2d');
        ctx.lineTo(x,y);
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth   = 3;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';
        ctx.stroke();
        lastPos.current = {x,y};
        setHasStrokes(true);
    };

    const stop = () => setDrawing(false);

    const clear = () => {
        const ctx = ref.current.getContext('2d');
        ctx.clearRect(0,0,ref.current.width,ref.current.height);
        setHasStrokes(false);
    };

    const save = () => {
        if(!hasStrokes) return;
        onSave(ref.current.toDataURL('image/png'));
    };

    return (
        <div className="space-y-3">
            <p className="text-[10px] font-black text-amber-500 uppercase text-center tracking-widest">{label}</p>
            <canvas ref={ref} className="signature-pad" style={{height:'140px'}}
                onMouseDown={start} onTouchStart={start}
                onMouseMove={move} onTouchMove={move}
                onMouseUp={stop}   onTouchEnd={stop}
                onMouseLeave={stop} />
            <div className="flex gap-2">
                <button onClick={clear} className="flex-1 py-3 bg-white/5 text-slate-400 rounded-2xl font-black uppercase text-[10px] border border-white/5 active:scale-95">Clear</button>
                <button onClick={save} disabled={!hasStrokes}
                    className={`flex-1 py-3 rounded-2xl font-black uppercase text-[10px] transition-all active:scale-95 ${hasStrokes?'gold-btn':'bg-white/5 text-slate-600'}`}>
                    {hasStrokes ? '✅ Confirm' : 'Sign above'}
                </button>
            </div>
        </div>
    );
}

// ─── MINI BAR CHART ─────────────────────────────────────────
function BarChart({data, color='#22c55e'}) {
    const max = Math.max(...data.map(d=>d.v), 1);
    return (
        <div className="flex items-end gap-1 h-24 w-full">
            {data.map((d,i)=>(
                <div key={i} className="flex-1 flex flex-col items-center gap-1">
                    <div className="bar w-full" style={{height:`${(d.v/max)*80}px`,background:color,minHeight:'4px'}}></div>
                    <span className="text-[7px] text-slate-600 font-black uppercase leading-none">{d.l}</span>
                </div>
            ))}
        </div>
    );
}

                                            </div>
                                            <div>
                                                <p className="text-[10px] text-slate-500 uppercase font-black mb-2">Materials ($) — Tiered Markup</p>
                                                <input type="number" placeholder="0" value={state.materialCost||''} className="input-lumina text-blue-400 text-center text-xl font-black" onChange={e=>setState({...state,materialCost:parseFloat(e.target.value)||0})} />
                                                {state.materialCost>0&&<p className="text-[9px] text-slate-500 text-center mt-1 font-black italic">Billed: ${Math.round(state.materialCost*(state.materialCost<50?1.4:state.materialCost<200?1.3:1.2))} ({state.materialCost<50?'40%':state.materialCost<200?'30%':'20%'} markup)</p>}
                                            </div>
                                            <div>
                                                <p className="text-[10px] text-slate-500 uppercase font-black mb-2">Risk Margin</p>
                                                <div className="grid grid-cols-4 gap-1">
                                                    {RISK_PRESETS.map(r=>(
                                                        <button key={r.v} onClick={()=>setState({...state,riskMargin:r.v})} className={`py-3 rounded-xl text-[8px] font-black border-2 transition-all ${state.riskMargin===r.v?'bg-orange-500 border-orange-500 text-white':'bg-white/5 border-white/5 text-slate-500'}`}>{r.label}{r.v>0?` +$${r.v}`:''}</button>
                                                    ))}
                                                </div>
                                            </div>
                                            {/* Desglose */}
                                            <div className="bg-black/40 p-4 rounded-2xl border border-white/5 text-[9px] font-black uppercase space-y-1">
                                                <div className="flex justify-between text-slate-400"><span>Labor</span><span>${pricing.labor}</span></div>
                                                <div className="flex justify-between text-slate-400"><span>Quick Jobs</span><span>${pricing.quick}</span></div>
                                                <div className="flex justify-between text-slate-400"><span>Materials</span><span>${pricing.mats}</span></div>
                                                <div className="flex justify-between text-slate-400"><span>Risk</span><span>+${state.riskMargin}</span></div>
                                                <div className="flex justify-between text-white border-t border-white/10 pt-1"><span>Total</span><span>${pricing.total}</span></div>
                                            </div>
                                        </div>
                                    ):state.svc==='postcon'?(
                                        <div className="p-6 bg-white/5 rounded-3xl border border-white/5">
                                            <p className="text-[10px] text-amber-500 uppercase font-black mb-2">SqFt Area Control</p>
                                            <input type="number" value={state.sqft} className="bg-transparent text-7xl font-black text-center w-full text-white outline-none italic leading-none" onChange={e=>setState({...state,sqft:parseInt(e.target.value)||0})} />
                                        </div>
                                    ):(
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-2">
                                                {[{l:'Beds',k:'beds'},{l:'Baths',k:'baths'},{l:'Living',k:'living'},{l:'Laundry',k:'laundryRoom'}].map(i=>(
                                                    <div key={i.k} className="bg-white/5 p-3 rounded-2xl text-center border border-white/5">
                                                        <span className="text-[9px] uppercase block mb-2 text-slate-400 font-black">{i.l}</span>
                                                        <div className="flex justify-between items-center">
                                                            <button onClick={()=>setState({...state,[i.k]:Math.max(0,state[i.k]-1)})} className="w-9 h-9 bg-white/10 rounded-lg text-white font-bold active:scale-95">-</button>
                                                            <span className="text-xl font-black italic text-white">{state[i.k]}</span>
                                                            <button onClick={()=>setState({...state,[i.k]:state[i.k]+1})} className="w-9 h-9 bg-white/10 rounded-lg text-white font-bold active:scale-95">+</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="grid grid-cols-4 gap-1 pt-2 border-t border-white/5">
                                                {[{l:'Tidy',v:0.9},{l:'Avg',v:1},{l:'Heavy',v:1.5},{l:'Ext',v:2.1}].map(c=>(
                                                    <button key={c.l} onClick={()=>setState({...state,complexity:c.v})} className={`py-3 rounded-xl text-[8px] font-black border-2 transition-all ${state.complexity===c.v?'bg-orange-500 border-orange-500 text-white shadow-lg':'bg-white/5 border-white/5 text-slate-500'}`}>{c.l}</button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {deployTab==='add-ons'&&(
                                <div className="space-y-5 animate-in fade-in">
                                    {state.svc==='handyman'?(
                                        <div className="p-10 text-center text-slate-500 font-black italic border-2 border-dashed border-white/5 rounded-3xl">🛠️ Handyman: time & materials only.</div>
                                    ):(
                                        <React.Fragment>
                                            <h3 className="text-[10px] uppercase text-amber-500 italic font-black text-center border-b border-white/5 pb-2">Premium Matrix</h3>
                                            <div className="grid grid-cols-2 gap-3">
                                                {ADDONS.map(ex=>(
                                                    <button key={ex.id} onClick={()=>setState({...state,[ex.id]:!state[ex.id]})}
                                                        className={`p-4 rounded-2xl flex justify-between items-center border transition-all active:scale-95 ${state[ex.id]?'bg-green-600 border-green-600 text-white font-black shadow-xl':'bg-white/5 border-white/5 text-slate-500'}`}>
                                                        <span className="text-[10px] uppercase font-black">{ex.label}</span>
                                                        <span className="text-[10px] font-black">+${ex.p}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            <div className="bg-amber-500/10 p-6 rounded-[2rem] border border-amber-500/20 text-center space-y-3">
                                                <span className="text-[10px] uppercase italic text-amber-500 font-black tracking-widest">Laundry Loads</span>
                                                <div className="flex justify-between items-center max-w-[150px] mx-auto">
                                                    <button onClick={()=>setState({...state,laundryLoads:Math.max(0,state.laundryLoads-1)})} className="w-12 h-12 bg-amber-500 text-black rounded-xl text-xl font-bold active:scale-95">-</button>
                                                    <span className="text-4xl font-black italic text-white">{state.laundryLoads}</span>
                                                    <button onClick={()=>setState({...state,laundryLoads:state.laundryLoads+1})} className="w-12 h-12 bg-amber-500 text-black rounded-xl text-xl font-bold active:scale-95">+</button>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            )}

                            {deployTab==='money'&&(
                                <div className="space-y-5 animate-in fade-in">
                                    <div className="grid grid-cols-2 gap-4 text-center font-black uppercase">
                                        <div className="space-y-1"><p className="text-[9px] text-slate-500">Expenses ($)</p><input type="number" value={state.expenses} className="input-lumina text-orange-400 text-center" onChange={e=>setState({...state,expenses:parseFloat(e.target.value)||0})} /></div>
                                        <div className="space-y-1"><p className="text-[9px] text-slate-500">Discount (%)</p>
                                            <select value={state.discount} className="input-lumina text-red-500 font-black text-center text-sm appearance-none" onChange={e=>setState({...state,discount:parseInt(e.target.value)})}>
                                                <option value="0">0%</option><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="space-y-3 border-t border-white/5 pt-4">
                                        <select value={state.team} className="input-lumina text-xs text-center" onChange={e=>setState({...state,team:e.target.value})}>
                                            <option value="">Select Team...</option>
                                            <option value="Team Alpha">Team Alpha</option>
                                            <option value="Team Beta">Team Beta</option>
                                            <option value="Jose Mario">Jose Mario (CEO)</option>
                                        </select>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1"><p className="text-[9px] text-slate-500 uppercase font-black">Deploy Date</p><input type="date" value={state.date} className="input-lumina text-[11px] font-black" onChange={e=>setState({...state,date:e.target.value})} /></div>
                                            <div className="space-y-1"><p className="text-[9px] text-slate-500 uppercase font-black">Deposit ($)</p><input type="number" placeholder="0" value={state.deposit} className="input-lumina text-blue-400 font-black text-center" onChange={e=>setState({...state,deposit:parseFloat(e.target.value)||0})} /></div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* PRICE CARD */}
                        <div className="bg-white text-black p-10 rounded-[4rem] text-center shadow-2xl relative overflow-hidden active:scale-95 transition-all">
                            <div className="absolute top-0 left-0 w-full h-2 bg-green-500 animate-pulse"></div>
                            <div className="flex justify-between items-center mb-4">
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Deployment Value</p>
                                <span className={`text-[9px] font-black px-3 py-1 rounded-lg border ${pricing.ac} border-current`}>{pricing.advice}</span>
                            </div>
                            <h4 className="text-[7rem] font-black italic tracking-tighter leading-none mb-6 text-black">
                                <span className="text-4xl align-top mr-1 font-light opacity-30">$</span>{state.totalPrice}
                            </h4>
                            <button onClick={deploy} className="w-full bg-slate-900 text-white py-8 rounded-[3rem] font-black text-xl uppercase italic active:scale-90 transition-all shadow-xl shadow-green-500/20">
                                {editId?'Update Mission ⚡':'Execute Stealth Deploy 🚀'}
                            </button>
                        </div>
                    </div>
                )}
            </main>

            {/* BOTTOM NAV */}
            <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-sm b2-card p-3 flex justify-around items-center border border-white/10 shadow-[0_40px_80px_rgba(0,0,0,1)] z-[1000]">
                {[['intel','brain','amber'],['agenda','shield-check','green'],['clients','users','purple'],['drive','image','blue'],['deploy','zap','blue']].map(([v,icon,c])=>(
                    <button key={v} onClick={()=>{if(v==='deploy'){setEditId(null);setState(INITIAL);setView('deploy');setDeployTab('identity');}else setView(v);}}
                        className={`p-3 rounded-2xl flex-1 flex flex-col items-center gap-1 transition-all ${view===v?`text-${c}-400 bg-white/5`:'text-slate-500'}`}>
                        <i data-lucide={icon} className="w-5 h-5"></i>
                        <span className="text-[7px] font-black uppercase">{v==='deploy'?'New':v}</span>
                    </button>
                ))}
            </nav>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
setTimeout(()=>lucide.createIcons(),500);
</script>
</body>
</html>
