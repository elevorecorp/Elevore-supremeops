    {view==='payroll'&&<div className="space-y-5 pb-24"><div className="g p-5 border-t-4 border-green-500"><p className="text-[9px] font-black text-slate-500 uppercase">Payroll Calculator</p><p className="text-[8px] text-slate-600 font-black">40% of collected + bonuses</p></div>{Object.entries(finance.payroll).length===0&&<div className="g p-10 text-center text-slate-500 font-black italic uppercase">No paid jobs yet.</div>}{Object.entries(finance.payroll).sort((a,b)=>b[1]-a[1]).map(([name,amount])=><div key={name} className="g p-5 border-l-4 border-green-500"><div className="flex justify-between"><div><h3 className="text-base font-black uppercase italic text-white">{name}</h3><p className="text-[8px] text-slate-500">{jobs.filter(j=>j.team_assigned===name&&j.status==='paid').length} paid jobs</p></div><p className="text-2xl font-black italic text-green-400">{isPrivate?'***':fmt$(amount)}</p></div></div>)}<div className="g p-5 space-y-2"><div className="flex justify-between"><span className="text-[9px] text-slate-400 font-black uppercase">Collected</span><span className="text-sm font-black text-white">{isPrivate?'***':fmt$(finance.col)}</span></div><div className="flex justify-between"><span className="text-[9px] text-slate-400 font-black uppercase">Payroll 40%</span><span className="text-sm font-black text-red-400">-{isPrivate?'***':fmt$(finance.col*CFG.STAFF_PAY)}</span></div><div className="flex justify-between"><span className="text-[9px] text-slate-400 font-black uppercase">Bonuses</span><span className="text-sm font-black text-amber-400">-{fmt$(finance.bonuses)}</span></div><div className="flex justify-between border-t border-white/10 pt-2"><span className="text-[9px] text-white font-black uppercase">Net</span><span className="text-lg font-black text-green-400">{isPrivate?'****':fmt$(finance.net)}</span></div></div><button onClick={exportCSV} className="w-full g py-4 rounded-xl font-black uppercase text-[9px] text-slate-400">Export Payroll CSV</button></div>}
    {view==='deploy'&&<div className="space-y-5 pb-32">{draft?.name&&draft.name!==state.name&&<div className="g p-4 border border-blue-500/30 flex justify-between"><p className="text-[9px] font-black text-blue-400 uppercase">Draft found: {draft.name}</p><button onClick={()=>setState({...INIT,...draft})} className="px-3 py-1.5 bg-blue-500/20 text-blue-400 rounded-xl text-[7px] font-black uppercase">Restore</button></div>}<div className="flex gap-1 bg-black/40 p-1 rounded-xl border border-white/5">{['identity','specs','add-ons','money'].map(t=><button key={t} onClick={()=>setDtab(t)} className={`flex-1 py-2.5 rounded-xl text-[8px] uppercase font-black ${dtab===t?'ton':'text-slate-500'}`}>{t}</button>)}</div><div className="g p-6 space-y-5">{dtab==='identity'&&<div className="space-y-3"><h3 className="text-[10px] uppercase text-amber-500 font-black tracking-widest border-b border-white/5 pb-2">Identity</h3><input className="inp uppercase" placeholder="Client full name" value={state.name} onChange={e=>onName(e.target.value)}/><input className="inp" placeholder="Phone number" value={state.phone} onChange={e=>setState({...state,phone:e.target.value})}/><input className="inp uppercase text-xs" placeholder="Full street address" value={state.address} onChange={e=>setState({...state,address:e.target.value})}/><input className="inp text-xs" placeholder="Audit photos link" value={state.audit_link} onChange={e=>setState({...state,audit_link:e.target.value})}/><textarea className="inp text-sm resize-none h-16" placeholder="Internal notes" value={state.notes} onChange={e=>setState({...state,notes:e.target.value})}></textarea><div className="grid grid-cols-4 gap-2">{['lead','scheduled','paid','completed'].map(s=><button key={s} onClick={()=>setState({...state,status:s})} className={`py-3 rounded-xl text-[8px] uppercase font-black ${state.status===s?'bg-amber-500 text-black':'bg-white/5 text-slate-500'}`}>{s}</button>)}</div><div className="grid grid-cols-4 gap-1">{[{l:'1x',v:'one-time'},{l:'Weekly',v:'weekly'},{l:'Bi-W',v:'bi-weekly'},{l:'Monthly',v:'monthly'}].map(f=><button key={f.v} onClick={()=>setState({...state,frequency:f.v})} className={`py-2 rounded-xl text-[7px] font-black ${state.frequency===f.v?'bg-blue-600 text-white':'bg-white/5 text-slate-500'}`}>{f.l}</button>)}</div></div>}{dtab==='specs'&&<div className="space-y-4 text-center font-black uppercase"><div className="grid grid-cols-5 gap-1">{['regular','deep','moveout','postcon','handyman'].map(s=><button key={s} onClick={()=>setState({...state,svc:s,selectedQuickJobs:[]})} className={`py-3 rounded-xl text-[7px] ${state.svc===s?'bg-green-600 text-white':'bg-white/5 text-slate-500'}`}>{s}</button>)}</div>{state.svc==='handyman'?<div className="space-y-4 text-left"><div className="bg-white/5 p-4 rounded-2xl"><p className="text-[9px] text-amber-500 uppercase text-center">Labor x $85/hr</p><div className="flex justify-between items-center max-w-[180px] mx-auto"><button onClick={()=>setState({...state,laborHours:Math.max(1,state.laborHours-1)})} className="w-10 h-10 bg-white/10 rounded-xl text-xl text-white">-</button><span className="text-3xl font-black italic text-white">{state.laborHours}h</span><button onClick={()=>setState({...state,laborHours:state.laborHours+1})} className="w-10 h-10 bg-white/10 rounded-xl text-xl text-white">+</button></div></div><div className="grid grid-cols-2 gap-2">{QJOBS.map(q=>{const sel=state.selectedQuickJobs.includes(q.id);return <button key={q.id} onClick={()=>setState(s=>({...s,selectedQuickJobs:sel?s.selectedQuickJobs.filter(x=>x!==q.id):[...s.selectedQuickJobs,q.id]}))} className={`p-2.5 rounded-xl text-[8px] font-black flex justify-between ${sel?'bg-green-600 text-white':'bg-white/5 text-slate-400'}`}><span>{q.en}</span><span>{fmt$(q.p)}</span></button>})}</div><input type="number" className="inp text-center" placeholder="Materials" value={state.materialCost||''} onChange={e=>setState({...state,materialCost:parseFloat(e.target.value)||0})}/></div>:state.svc==='postcon'?<div className="p-5 bg-white/5 rounded-2xl"><p className="text-[9px] text-amber-500 uppercase">SqFt</p><input type="number" value={state.sqft} className="bg-transparent text-6xl font-black text-center w-full text-white outline-none italic" onChange={e=>setState({...state,sqft:parseInt(e.target.value)||0})}/></div>:<div className="space-y-3"><div className="grid grid-cols-2 gap-2">{[{l:'Beds',k:'beds'},{l:'Baths',k:'baths'},{l:'Living',k:'living'},{l:'Laundry',k:'laundryRoom'}].map(i=><div key={i.k} className="bg-white/5 p-3 rounded-xl"><span className="text-[8px] text-slate-400">{i.l}</span><div className="flex justify-between items-center"><button onClick={()=>setState({...state,[i.k]:Math.max(0,state[i.k]-1)})} className="w-8 h-8 bg-white/10 rounded-lg text-white">-</button><span className="text-xl font-black italic text-white">{state[i.k]}</span><button onClick={()=>setState({...state,[i.k]:state[i.k]+1})} className="w-8 h-8 bg-white/10 rounded-lg text-white">+</button></div></div>)}</div><div className="grid grid-cols-4 gap-1">{[{l:'Tidy',v:.9},{l:'Avg',v:1},{l:'Heavy',v:1.5},{l:'Ext',v:2.1}].map(c=><button key={c.l} onClick={()=>setState({...state,complexity:c.v})} className={`py-2 rounded-xl text-[7px] ${state.complexity===c.v?'bg-orange-500 text-white':'bg-white/5 text-slate-500'}`}>{c.l}</button>)}</div></div>}<div className="grid grid-cols-2 gap-2 text-left pt-2 border-t border-white/5">{MBS.map(m=><button key={m.id} onClick={()=>setState({...state,membership:m.id})} className="g p-3 text-left" style={{borderColor:state.membership===m.id?m.color:'rgba(255,255,255,.08)'}}><div className="flex justify-between"><span className="font-black uppercase text-[10px] text-white">{m.name}</span><span className="font-black text-[10px]" style={{color:m.color}}>{m.price?fmt$(m.price)+'/mo':''}</span></div></button>)}</div></div>}{dtab==='add-ons'&&<div className="space-y-4">{state.svc==='handyman'?<div className="p-8 text-center text-slate-500 font-black italic border-2 border-dashed border-white/5 rounded-2xl">Handyman uses time and materials.</div>:<React.Fragment><div className="grid grid-cols-2 gap-2">{ADDONS.map(ex=><button key={ex.id} onClick={()=>setState({...state,[ex.id]:!state[ex.id]})} className={`p-3.5 rounded-xl flex justify-between ${state[ex.id]?'bg-green-600 text-white':'bg-white/5 text-slate-500'}`}><span className="text-[9px] uppercase font-black">{ex.en}</span><span className="text-[9px] font-black">+${ex.p}</span></button>)}</div><div className="bg-amber-500/10 p-5 rounded-2xl text-center"><span className="text-[9px] uppercase text-amber-500 font-black">Laundry Loads</span><div className="flex justify-between items-center max-w-[140px] mx-auto mt-3"><button onClick={()=>setState({...state,laundryLoads:Math.max(0,state.laundryLoads-1)})} className="w-11 h-11 bg-amber-500 text-black rounded-xl text-xl font-bold">-</button><span className="text-3xl font-black italic text-white">{state.laundryLoads}</span><button onClick={()=>setState({...state,laundryLoads:state.laundryLoads+1})} className="w-11 h-11 bg-amber-500 text-black rounded-xl text-xl font-bold">+</button></div></div></React.Fragment>}</div>}{dtab==='money'&&<div className="space-y-4"><div className="grid grid-cols-2 gap-3"><input type="number" className="inp text-center" placeholder="Expenses" value={state.expenses||''} onChange={e=>setState({...state,expenses:parseFloat(e.target.value)||0})}/><select value={state.discount} className="inp text-center" onChange={e=>setState({...state,discount:parseInt(e.target.value)||0})}><option value="0">0%</option><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option></select></div><select value={state.team} className="inp text-center" onChange={e=>setState({...state,team:e.target.value})}><option value="">Select Team...</option><option>Team Alpha</option><option>Team Beta</option><option>Jose Mario</option></select><div className="grid grid-cols-2 gap-3"><input type="date" value={state.date||''} className="inp text-[10px]" onChange={e=>setState({...state,date:e.target.value})}/><input type="number" placeholder="Deposit" value={state.deposit||''} className="inp text-center" onChange={e=>setState({...state,deposit:parseFloat(e.target.value)||0})}/></div></div>}</div><div className="bg-white text-black p-8 rounded-[2rem] text-center"><div className="flex justify-between mb-3"><p className="text-[9px] font-black text-slate-400 uppercase">Deployment Value</p><span className={`text-[8px] font-black px-3 py-1 rounded-lg border ${pricing.ac}`}>{pricing.advice}</span></div><h4 className="text-[5rem] font-black italic leading-none">{fmt$(pricing.total)}</h4>{state.deposit>0&&<p className="text-[8px] text-slate-500 font-black mb-4">Pocket estimate: {fmt$(Math.round(state.deposit-(state.deposit*CFG.STAFF_PAY)-(state.expenses||0)))}</p>}<button onClick={deploy} className="w-full bg-slate-900 text-white py-5 rounded-[1.8rem] font-black text-lg uppercase">{editId?'Update Mission':'Execute Deploy'}</button></div></div>}
  </main><nav className="fixed bottom-5 left-1/2 -translate-x-1/2 w-[94%] max-w-sm g p-2 flex justify-around z-[1000] no-print">{[['brief','sun','AM'],['intel','bar-chart-2','Intel'],['agenda','shield-check','Logs'],['clients','users','DNA'],['drive','image','Drive'],['deploy','zap','New']].map(([v,ic,l])=><button key={v} onClick={()=>{if(v==='deploy'){setEdit(null);setState(INIT);setDtab('identity')}setView(v)}} className={`p-2 rounded-xl flex-1 flex flex-col items-center gap-.5 ${view===v?'text-amber-400 bg-white/5':'text-slate-600'}`}><i data-lucide={ic} className="w-3.5 h-3.5"></i><span className="text-[5px] font-black uppercase">{l}</span></button>)}</nav></div>
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
setTimeout(()=>lucide.createIcons(),500);
</script>
</body>
</html>
